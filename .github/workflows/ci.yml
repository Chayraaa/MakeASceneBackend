name: CI Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: makeascene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PYTHONPATH: .
      TESTING: "true"
      POSTGIS_TEST_DATABASE_URI: postgresql+psycopg2://postgres:postgres@localhost:5432/makeascene_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --cov-fail-under=70

      - name: Validate monitoring configuration
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/prometheus:/etc/prometheus:ro"
          prom/prometheus:latest check config /etc/prometheus/prometheus.yml
