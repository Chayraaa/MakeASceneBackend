# Place this file at: .github/workflows/deploy.yml  (in your repo, not in k8s/)

name: Build and Deploy

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Actions expressions have no built-in lowercase function —
      # github.repository_owner can contain uppercase letters, but GHCR
      # (and Docker registries generally) require lowercase image names.
      # This computes it once in bash and reuses it everywhere below.
      - name: Compute lowercase image name
        id: vars
        run: |
          echo "image_name=ghcr.io/$(echo '${{ github.repository_owner }}/makeascene-backend' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Run database migration
        run: |
          sed -e "s/REPLACE_ME/${{ github.sha }}/" \
              -e "s|your-registry/makeascene-backend:latest|${{ needs.build-and-push.outputs.image_name }}:${{ github.sha }}|" \
              k8s/10-migrate-job.yaml > migrate-job.yaml

          kubectl apply -f migrate-job.yaml

          kubectl wait --for=condition=complete \
            job/backend-migrate-${{ github.sha }} \
            -n makeascene --timeout=300s

      - name: Roll out new image
        run: |
          kubectl set image deployment/backend \
            backend=${{ needs.build-and-push.outputs.image_name }}:${{ github.sha }} \
            -n makeascene
          kubectl rollout status deployment/backend -n makeascene