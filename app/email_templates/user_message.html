<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>{title}</title>
</head>
<body style="margin:0;padding:0;background-color:#03191f;color:#eef5df;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#03191f" style="padding:40px 16px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;border:1px solid #154b5c;">
        <tr><td bgcolor="#154b5c" style="padding:22px 32px;color:#eef5df;font-size:22px;font-weight:bold;letter-spacing:0.5px;">
          <span style="color:#eef5df;font-size:26px;vertical-align:middle;">&#9679;</span>&nbsp; MakeAScene
        </td></tr>
        <tr><td bgcolor="#122f38" style="padding:36px 32px;">
          <p style="margin:0 0 16px;color:#aec3b2;font-size:12px;font-weight:bold;letter-spacing:2px;">EINE NACHRICHT FÜR DICH</p>
          <h1 style="margin:0 0 24px;color:#eef5df;font-size:28px;line-height:1.3;">{title}</h1>
          <p style="margin:0;color:#eef5df;font-size:16px;line-height:1.7;overflow-wrap:anywhere;">{message}</p>
          
          <p style="margin:32px 0 0;padding-top:24px;border-top:1px solid #597f8b;color:#aec3b2;font-size:13px;line-height:1.6;">Du erhältst diese E-Mail, weil E-Mail-Benachrichtigungen für dein Konto aktiviert sind.<br><a href="{unsubscribe_url}" style="color:#eef5df;text-decoration:underline;">E-Mail-Benachrichtigungen abbestellen</a></p>
        </td></tr>
        <tr><td bgcolor="#03191f" style="padding:22px 32px;color:#aec3b2;font-size:12px;line-height:1.6;">
          Make A Scene
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
