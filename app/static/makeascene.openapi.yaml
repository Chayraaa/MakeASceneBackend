openapi: 3.1.0
info:
  title: makeascene
  description: |
    The API used for the frontend and third-party for Make A Scene
  version: 1.3.0
tags:
  - name: Users
  - name: Tags
  - name: Message
  - name: Authentication
  - name: OAuth
  - name: Health
  - name: Search
  - name: Site Account
paths:
  /users/me/tags/{id}:
    delete:
      summary: Unsubscribe tag
      deprecated: false
      description: Remove a tag if it exists.
      operationId: deleteTag
      tags:
        - Users
        - Tags
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '404':
          $ref: '#/components/responses/NotFound'
          description: ''
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
    post:
      summary: Subscribe tag
      deprecated: false
      description: Saves a tag if it exists.
      operationId: saveTag
      tags:
        - Users
        - Tags
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '404':
          $ref: '#/components/responses/NotFound'
          description: ''
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /users/me/tags:
    get:
      summary: Get all subscribed tags
      deprecated: false
      description: Get the tags you saved.
      operationId: getTags
      tags:
        - Users
        - Tags
      parameters:
        - name: page
          in: query
          description: ''
          required: false
          example: 1
          schema:
            type: integer
        - name: page_size
          in: query
          description: ''
          required: false
          example: 25
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagQueryResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /users/me/tags/block/{id}:
    post:
      summary: Block tag
      deprecated: false
      description: Blocks a tag if it exists.
      operationId: blockTag
      tags:
        - Users
        - Tags
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '404':
          $ref: '#/components/responses/NotFound'
          description: ''
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
    delete:
      summary: Unblock Tag
      deprecated: false
      description: Unblocks a tag if it exists and is blocked.
      operationId: unblockTag
      tags:
        - Users
        - Tags
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '404':
          $ref: '#/components/responses/NotFound'
          description: ''
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /users/me/tags/block:
    get:
      summary: Get all blocked tags
      deprecated: false
      description: Returns all the tags a user blocked
      operationId: getBlockedTags
      tags:
        - Users
        - Tags
      parameters:
        - name: page
          in: query
          description: ''
          required: false
          example: 1
          schema:
            type: integer
        - name: page_size
          in: query
          description: ''
          required: false
          example: 25
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
        - BearerAuth: []
  /users/me:
    get:
      summary: Get info about yourself
      deprecated: false
      description: Retrieve info about yourself
      operationId: getInfo
      tags:
        - Users
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
    patch:
      summary: Change info about yourself
      deprecated: false
      description: Change info about yourself
      operationId: changeInfo
      tags:
        - Users
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
    delete:
      summary: Delete yourself
      deprecated: false
      description: Deletes your account
      operationId: deleteUser
      tags:
        - Users
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /users/me/messages:
    get:
      summary: Messages
      deprecated: false
      description: Retrieval of the messages for a user.
      operationId: userMessages
      tags:
        - Users
        - Message
      parameters:
        - name: page
          in: query
          description: ''
          required: false
          example: 1
          schema:
            type: integer
        - name: page_size
          in: query
          description: ''
          required: false
          example: 25
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /users:
    post:
      summary: Create user
      deprecated: false
      description: >-
        Registers a new user with email and password. Fails if the email is
        already taken or if input validation fails.
      operationId: createUser
      tags:
        - Users
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              ValidRequest:
                value:
                  email: max.mustermann@example.com
                  password: securePassword123
                summary: Valid registration
              WeakPassword:
                value:
                  email: max.mustermann@example.com
                  password: short
                summary: Password too short (triggers 422)
              InvalidEmail:
                value:
                  email: no-email
                  password: securePassword123
                summary: Invalid email format (triggers 422)
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: User created successfully.
          headers: {}
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: conflict
                message: User already exists.
          headers: {}
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/email/confirm:
    get:
      summary: Confirm Email
      deprecated: false
      description: Used to confirm an account for creation via a sent email
      operationId: confirmPassword
      tags:
        - Authentication
      parameters:
        - name: token
          in: query
          description: ''
          required: true
          example: _sahjdoDSljjwpioSj1df...
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailConfirmed'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/email/resend:
    post:
      summary: Resend Email
      deprecated: false
      description: Used to request a resend of the confirmation email
      operationId: resendEmail
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailResendRequest'
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSent'
              example:
                message: Email sent if an unconfirmed user with that email exists.
          headers: {}
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/password/reset:
    post:
      summary: Change Password
      deprecated: false
      description: Used when the password should be changed or was forgotten
      operationId: changePassword
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChanged'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/logout:
    post:
      summary: Logout
      deprecated: false
      description: Logs a user out. Meaning it invalidates the refresh tokens
      operationId: logout
      tags:
        - Authentication
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example: >
                <!doctype html>

                <html lang=en>

                <title>404 Not Found</title>

                <h1>Not Found</h1>

                <p>The requested URL was not found on the server. If you entered
                the URL manually please check your spelling and try again.</p>
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /auth/password/request-reset:
    post:
      summary: Request Password Reset
      deprecated: false
      description: Used to request a password change with an email.
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailResendRequest'
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSent'
          headers: {}
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/sessions:
    post:
      summary: Login email and password/refresh token
      deprecated: false
      description: >-
        Authenticates a user with email and password or refresh token and
        returns a JWT token on success.
      operationId: localLogin
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    email:
                      type: string
                      format: email
                      examples:
                        - max.mustermann@example.com
                    password:
                      type: string
                      format: password
                      examples:
                        - securePassword123
                  required:
                    - email
                    - password
                - type: object
                  properties:
                    refresh_token:
                      type: string
                      examples:
                        - _sahjdoDSljjwpioSj1dfhj...
                  required:
                    - refresh_token
            examples:
              ValidLogin:
                value:
                  email: max.mustermann@example.com
                  password: securePassword123
                summary: Valid credentials
              WrongPassword:
                value:
                  email: max.mustermann@example.com
                  password: wrongPassword
                summary: Wrong password (triggers 401)
              UnknownUser:
                value:
                  email: unbekannt@example.com
                  password: securePassword123
                summary: Unknown email (triggers 401)
        required: true
      responses:
        '201':
          description: Login successful – JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                message: Login successful. Use token for authentication.
                access_token: eyJhbGciOiJIUzI1NiIsI...
                refresh_token: _sahjdoDSljjwpioSj1dfhj...
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/oauth/exchange:
    post:
      summary: Exchange login info for oauth users
      deprecated: false
      description: 'Gets the refresh and access tokens for a user that logs in with oauth. '
      operationId: exchangeOauth
      tags:
        - OAuth
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeTokenResponse'
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/oauth/redirect:
    get:
      summary: Redirect to OAuth provider
      deprecated: false
      description: >
        Starts the OAuth 2.0 flow. The client is redirected to the chosen
        provider's login page. Currently only `google` is supported. After
        successful authentication the provider calls back to
        `/auth/oauth/google/callback`.
      operationId: oauthRedirect
      tags:
        - OAuth
        - Authentication
      parameters:
        - name: auth
          in: query
          description: ''
          required: true
          example: google
          schema:
            type: string
            enum:
              - google
      responses:
        '302':
          description: Redirect to OAuth provider login page (e.g. Google)
          content:
            text/html:
              schema:
                type: object
                properties: {}
          headers:
            Location:
              required: false
              description: URL of the OAuth provider's authorization endpoint
              schema:
                type: string
                example: >-
                  https://accounts.google.com/o/oauth2/v2/auth?client_id=...&redirect_uri=...&response_type=code&scope=openid+email+profile&state=...
        '400':
          description: Invalid or missing `auth` query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid authentication provider
                message: 'Supported providers: google'
          headers: {}
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /auth/oauth/google/callback:
    get:
      summary: OAuth callback (Google)
      deprecated: false
      description: >
        Called by Google after the user has authenticated. Exchanges the
        authorization code for a JWT token. Do not call this endpoint directly.
      tags:
        - OAuth
        - Authentication
      parameters:
        - name: code
          in: query
          description: Authorization code returned by Google
          required: false
          schema:
            type: string
            examples:
              - 4/0AX4XfWh...
        - name: state
          in: query
          description: >-
            State parameter for CSRF protection (must match the value set during
            redirect)
          required: false
          schema:
            type: string
            examples:
              - randomStateValue123
        - name: error
          in: query
          description: Set by Google if the user denied access
          required: false
          schema:
            type: string
            examples:
              - access_denied
      responses:
        '201':
          description: OAuth login successful – JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeTokenResponse'
              example:
                exchange: eyJhbGciOiJIUzI1NiIsI...
          headers: {}
        '400':
          description: OAuth failure (state mismatch, missing token, or missing user info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                StateMismatch:
                  summary: CSRF state mismatch
                  value:
                    error: oauth_state_mismatch
                    message: Login session expired or invalid state. Please try again.
                TokenFailure:
                  summary: Google did not return a token
                  value:
                    error: oauth_failure
                    message: Failed to authorize with Google.
                UserInfoMissing:
                  summary: User info missing from token
                  value:
                    error: oauth_failure
                    message: Failed to fetch user info from Google.
                AuthFailure:
                  summary: Internal user authentication failed
                  value:
                    error: oauth_failure
                    message: Failed to authenticate user.
          headers: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /health:
    get:
      summary: Health check
      deprecated: false
      description: >-
        Returns 200 if the application is running. Can be used by load balancers
        or monitoring tools.
      tags:
        - Health
      parameters: []
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples:
                      - ok
              example:
                status: ok
          headers: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /tags:
    get:
      summary: Search for a tag
      deprecated: false
      description: ''
      tags:
        - Tags
        - Search
      parameters:
        - name: query
          in: query
          description: ''
          required: true
          example: test tag
          schema:
            type: string
        - name: autocomplete
          in: query
          description: ''
          required: true
          schema:
            type: boolean
        - name: page
          in: query
          description: ''
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagQueryResponse'
          headers: {}
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /tags/{id}:
    get:
      summary: Get info for a tag
      deprecated: false
      description: Get data about a specific tag
      operationId: tagById
      tags:
        - Tags
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          headers: {}
        '404':
          $ref: '#/components/responses/NotFound'
          description: ''
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security: []
  /site-accounts:
    post:
      summary: Create site account
      deprecated: false
      description: Creates a site account
      operationId: siteAccountCreation
      tags:
        - Site Account
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteAccount'
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAccountResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication failed
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: ''
      security:
        - BearerAuth: []
  /site-accounts/{id}:
    get:
      summary: Get site account info
      deprecated: false
      description: Returns the info of a site account.
      operationId: getSiteAccount
      tags:
        - Site Account
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAccount'
          headers: {}
        '404':
          $ref: '#/components/responses/NotFound'
          description: ''
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Validation error – one or more fields failed validation
