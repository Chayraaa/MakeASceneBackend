components:
  schemas:
    EmailConfirmed:
      type: object
      properties:
        message:
          type: string
          examples:
            - Email confirmed.
      required:
        - message
    EmailSent:
      type: object
      properties:
        message:
          type: string
          examples:
            - Email sent if an unconfirmed user with that email exists.
      required:
        - message
    EmailResendRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          examples:
            - test@test.com
      required:
        - email
    ChangePasswordRequest:
      type: object
      properties:
        token:
          type: string
          examples:
            - ltmk1VomO8dTxdKQEVYC39TKtCzU...
        new_password:
          type: string
          minLength: 8
          examples:
            - securePass123
          format: password
      required:
        - token
        - new_password
    PasswordChanged:
      type: object
      properties:
        message:
          type: string
          examples:
            - Password was changed
      required:
        - message
    UserInfoResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID
        email:
          type: string
          format: email
          examples:
            - test@test.com
        mature:
          type: boolean
          default: true
        email_preference:
          type: boolean
          default: true
      required:
        - mature
        - email_preference
        - email
        - id
    PatchUserRequest:
      type: object
      properties:
        mature:
          type: boolean
          default: true
        email_preference:
          type: boolean
          default: true
    CreateUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          examples:
            - max.mustermann@example.com
        password:
          type: string
          format: password
          minLength: 8
          examples:
            - securePassword123
    DeleteUserResponse:
      type: object
      properties:
        message:
          type: string
          examples:
            - Deletion was successful.
      required:
        - message
    MessageResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              sender:
                type: string
                examples:
                  - test event
              message:
                type: string
                examples:
                  - test message
            required:
              - sender
              - message
      required:
        - messages
    SessionRequestRefreshToken:
      type: object
      description: Login request
      properties:
        refresh_token:
          type: string
          examples:
            - _sahjdoDSljjwpioSj1dfhj...
      required:
        - refresh_token
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          examples:
            - All refresh tokens were invalidated.
      required:
        - message
    ExchangeTokenResponse:
      type: object
      properties:
        exchange:
          type: string
          examples:
            - sod2_02Jdj...
          description: |
            The token returned to retrieve the actual login data
      required:
        - exchange
    SessionRequestEmailPass:
      type: object
      description: Login request
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          examples:
            - max.mustermann@example.com
        password:
          type: string
          format: password
          examples:
            - securePassword123
    SessionResponse:
      type: object
      properties:
        message:
          type: string
          examples:
            - Login successful. Use token for authentication.
        access_token:
          type: string
          examples:
            - eyJhbGciOiJIUzI1NiIsI...
        refresh_token:
          type: string
          examples:
            - _sahjdoDSljjwpioSj1dfhj...
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          examples:
            - Request body validation failed
        message:
          type: string
          examples:
            - A human-readable description of the error.
    TagQueryResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID
              name:
                type: string
                description: name
                examples:
                  - test tag
              parent:
                type:
                  - integer
                  - 'null'
                description: The parent tag
            required:
              - id
              - name
          description: tag
      required:
        - tags
    TagResponse:
      type: object
      properties:
        message:
          type: string
          examples:
            - Tag saved.
      required:
        - message
    TagSaveRequest:
      type: object
      properties:
        tag_id:
          type: integer
      required:
        - tag_id
    Tag:
      type: object
      properties:
        id:
          type: integer
          description: ID
        name:
          type: string
          description: name
          examples:
            - test tag
        parent:
          type:
            - integer
            - 'null'
          description: The parent tag
      required:
        - id
        - name
    SiteAccount:
      type: object
      properties:
        id:
          type: integer
          description: ID
        name:
          type: string
          description: name
          examples:
            - Test Organizer
        creator_id:
          type: integer
      required:
        - id
        - name
        - creator_id
    CreateSiteAccount:
      type: object
      properties:
        name:
          type: string
          description: name
          examples:
            - Test Organizer
        creator_id:
          type: integer
      required:
        - name
        - creator_id
    SiteAccountResponse:
      type: object
      properties:
        message:
          type: string
          examples:
            - Account created.
      required:
        - message
    SiteAccountChangeRequest:
      type: object
      properties:
        name:
          type: string
          description: name
          examples:
            - Test Organizer
      required:
        - name
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                examples:
                  - unauthorized
              message:
                type: string
                examples:
                  - Invalid credentials.
            required:
              - error
              - message
          examples:
            Success:
              summary: Success
              value:
                error: unauthorized
                message: Invalid credentials.
    UnprocessableEntity:
      description: Validation error – one or more fields failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                examples:
                  - Request body validation failed
              fields:
                type: array
                items:
                  type: string
                examples:
                  - - '''password'' is too short (minimum length: 8)'
                    - '''email'' is not a valid email address'
          examples:
            Example 1:
              summary: Example 1
              value:
                error: Request body validation failed
                fields:
                  - '''password'' is too short (minimum length: 8)'
                  - '''email'' is not a valid email address'
    InternalServerError:
      description: ''
      content:
        application/octet-stream:
          schema:
            type: object
            properties: {}
          examples:
            Example 1:
              summary: Example 1
              value: {}
    NotFound:
      description: ''
      content:
        application/json:
          schema:
            title: ''
            type: object
            properties:
              error:
                type: string
                examples:
                  - Not found
              message:
                type: string
                examples:
                  - Tag was not found.
            required:
              - error
              - message
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  examples:
    CreateUserSuccess:
      value:
        message: User created successfully.
    UserAlreadyExists:
      value:
        error: conflict
        message: User already exists.
    ValidationError:
      value:
        error: Request body validation failed
        fields:
          - '''password'' is too short (minimum length: 8)'
          - '''email'' is not a valid email address'
    InvalidCredentials:
      value:
        error: unauthorized
        message: Invalid credentials.
    OAuthStateMismatch:
      value:
        error: oauth_state_mismatch
        message: Login session expired or invalid state. Please try again.
    OAuthFailure:
      value:
        error: oauth_failure
        message: Failed to authorize with Google.
    LoginSuccess:
      value:
        message: Login successful. Use token for authentication.
        token: >-
          eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U
servers:
  - url: http://127.0.0.1:5000/v1
    description: http://127.0.0.1:5000/v1
security:
  - BearerAuth: []
