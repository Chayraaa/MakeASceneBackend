openapi: 3.1.0
info:
  title: Application API
  version: 1.3.0
  description: REST API for user management and authentication.
servers:
  - url: http://127.0.0.1:5000/v1
security:
  - BearerAuth: [ ]
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateUserRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          example: "max.mustermann@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "securePassword123"
    SessionRequest:
      type: object
      description: Login request (currently only supports password login in this endpoint)
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          example: "max.mustermann@example.com"
        password:
          type: string
          format: password
          example: "securePassword123"
    SessionResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful. Use token for authentication."
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U"
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Request body validation failed"
        message:
          type: string
          example: "A human-readable description of the error."
  examples:
    CreateUserSuccess:
      value:
        message: "User created successfully."
    UserAlreadyExists:
      value:
        error: "conflict"
        message: "User already exists."
    ValidationError:
      value:
        error: "Request body validation failed"
        fields:
          - "'password' is too short (minimum length: 8)"
          - "'email' is not a valid email address"
    InvalidCredentials:
      value:
        error: "unauthorized"
        message: "Invalid credentials."
    OAuthStateMismatch:
      value:
        error: "oauth_state_mismatch"
        message: "Login session expired or invalid state. Please try again."
    OAuthFailure:
      value:
        error: "oauth_failure"
        message: "Failed to authorize with Google."
    LoginSuccess:
      value:
        message: "Login successful. Use token for authentication."
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U"
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "unauthorized"
            message: "Invalid credentials."
    UnprocessableEntity:
      description: Validation error – one or more fields failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Request body validation failed"
              fields:
                type: array
                items:
                  type: string
                example:
                  - "'password' is too short (minimum length: 8)"
                  - "'email' is not a valid email address"
paths:
  /users:
    post:
      tags: [ "Users" ]
      summary: Create user
      description: Registers a new user with email and password. Fails if the email is already taken or if input validation fails.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              ValidRequest:
                summary: Valid registration
                value:
                  email: "max.mustermann@example.com"
                  password: "securePassword123"
              WeakPassword:
                summary: Password too short (triggers 422)
                value:
                  email: "max.mustermann@example.com"
                  password: "short"
              InvalidEmail:
                summary: Invalid email format (triggers 422)
                value:
                  email: "no-email"
                  password: "securePassword123"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "User created successfully."
        "409":
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "conflict"
                message: "User already exists."
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/sessions:
    post:
      tags: [ "Authentication" ]
      summary: Login with email and password
      description: Authenticates a user with email and password and returns a JWT token on success.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
            examples:
              ValidLogin:
                summary: Valid credentials
                value:
                  email: "max.mustermann@example.com"
                  password: "securePassword123"
              WrongPassword:
                summary: Wrong password (triggers 401)
                value:
                  email: "max.mustermann@example.com"
                  password: "wrongPassword"
              UnknownUser:
                summary: Unknown email (triggers 401)
                value:
                  email: "unbekannt@example.com"
                  password: "securePassword123"
      responses:
        "201":
          description: Login successful – JWT token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              example:
                message: "Login successful. Use token for authentication."
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/oauth/redirect:
    get:
      tags: [ "OAuth", "Authentication" ]
      summary: Redirect to OAuth provider
      description: >
        Starts the OAuth 2.0 flow. The client is redirected to the chosen
        provider's login page. Currently only `google` is supported.
        After successful authentication the provider calls back to
        `/auth/oauth/google/callback`.
      security: [ ]
      parameters:
        - name: auth
          in: query
          required: true
          schema:
            type: string
            enum: [ google ]
          example: google
      responses:
        "302":
          description: Redirect to OAuth provider login page (e.g. Google)
          headers:
            Location:
              description: URL of the OAuth provider's authorization endpoint
              schema:
                type: string
                example: "https://accounts.google.com/o/oauth2/v2/auth?client_id=...&redirect_uri=...&response_type=code&scope=openid+email+profile&state=..."
        "400":
          description: Invalid or missing `auth` query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Invalid authentication provider"
                message: "Supported providers: google"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /auth/oauth/google/callback:
    get:
      tags: [ "OAuth", "Authentication" ]
      summary: OAuth callback (Google)
      description: >
        Called by Google after the user has authenticated.
        Exchanges the authorization code for a JWT token.
        Do not call this endpoint directly.
      security: [ ]
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code returned by Google
          schema:
            type: string
            example: "4/0AX4XfWh..."
        - name: state
          in: query
          required: false
          description: State parameter for CSRF protection (must match the value set during redirect)
          schema:
            type: string
            example: "randomStateValue123"
        - name: error
          in: query
          required: false
          description: Set by Google if the user denied access
          schema:
            type: string
            example: "access_denied"
      responses:
        "201":
          description: OAuth login successful – JWT token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              example:
                message: "Login successful. Use token for authentication."
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U"
        "400":
          description: OAuth failure (state mismatch, missing token, or missing user info)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                StateMismatch:
                  summary: CSRF state mismatch
                  value:
                    error: "oauth_state_mismatch"
                    message: "Login session expired or invalid state. Please try again."
                TokenFailure:
                  summary: Google did not return a token
                  value:
                    error: "oauth_failure"
                    message: "Failed to authorize with Google."
                UserInfoMissing:
                  summary: User info missing from token
                  value:
                    error: "oauth_failure"
                    message: "Failed to fetch user info from Google."
                AuthFailure:
                  summary: Internal user authentication failed
                  value:
                    error: "oauth_failure"
                    message: "Failed to authenticate user."
  /health:
    get:
      tags: [ "Health" ]
      summary: Health check
      description: Returns 200 if the application is running. Can be used by load balancers or monitoring tools.
      security: [ ]
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
              example:
                status: "ok"
