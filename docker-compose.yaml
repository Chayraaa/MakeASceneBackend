version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      typesense:
        condition: service_healthy
    env_file:
      - normal.env
      - secrets.env

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makeascene
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  typesense:
    image: ghcr.io/batonogov/typesense:latest
    restart: on-failure
    ports:
      - "8108:8108"
    env_file:
      - normal.env
      - secrets.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8108/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

    volumes:
      - typesense_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh
    command: >
      -c "
      ollama serve &
      sleep 5 &&
      ollama pull gemma2:9b &&
      ollama pull qwen2.5:1.5b &&
      wait
      "

volumes:
  postgres_data:
  minio_data:
  typesense_data:
  ollama_data: