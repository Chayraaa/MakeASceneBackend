apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: makeascene-db
  namespace: makeascene
spec:
  instances: 2                      # 1 Primary + 1 Replica; 3 für echtes HA-Quorum
  imageName: ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie
  storage:
    size: 10Gi

  bootstrap:
    initdb:
      database: makeascene
      owner: makeascene
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;

  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 1Gi }

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: makeascene-backups
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: makeascene-backups
  namespace: makeascene
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://makeascene-db-backup/
    endpointURL: https://nbg1.your-objectstorage.com
    s3Credentials:
      accessKeyId:     { name: makeascene-secrets, key: S3_ACCESS_KEY }
      secretAccessKey: { name: makeascene-secrets, key: S3_SECRET_KEY }
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: makeascene-daily
  namespace: makeascene
spec:
  schedule: "0 0 3 * * *"
  cluster:
    name: makeascene-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io