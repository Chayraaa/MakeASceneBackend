apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: makeascene
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: makeascene-backend
        metrics_path: /metrics
        # Discover each pod so counter samples never alternate between replicas.
        dns_sd_configs:
          - names:
              - backend-metrics.makeascene.svc.cluster.local
            type: A
            port: 5000
  alerts.yml: |
    groups:
      - name: makeascene
        rules:
          - alert: BackendScrapeDown
            expr: (up{job="makeascene-backend"} == 0) or absent(up{job="makeascene-backend"})
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Backend metrics target is unreachable
          - alert: BackendOperationErrors
            expr: sum by (service, operation) (increase(backend_operations_total{result="error"}[10m])) >= 5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Repeated backend operation failures
              description: Inspect operation outcomes and latency in the Make A Scene dashboard.
          - alert: EventWriteFailures
            expr: sum by (operation) (increase(backend_operations_total{service="event",operation=~"create|update",result="rejected"}[10m])) >= 5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Repeated rejected event writes
          - alert: LocationResolutionFailures
            expr: sum(increase(location_resolution_total{source="unresolved"}[10m])) >= 10
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Locations repeatedly have no usable geometry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: makeascene
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
              readOnly: true
            - name: prometheus-storage
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: makeascene
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: makeascene
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
    - name: metrics
      port: 5000
      targetPort: 5000
