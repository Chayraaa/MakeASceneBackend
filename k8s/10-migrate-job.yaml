apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate-REPLACE_ME   # per sed ersetzen, siehe unten
  namespace: makeascene
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z makeascene-db-rw 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2
              done
              echo "PostgreSQL is up."
      containers:
        - name: migrate
          image: ghcr.io/chayraaa/makeascene-backend:latest   # CI ersetzt den Tag
          command: ["flask", "db", "upgrade"]
          envFrom:
            - configMapRef:
                name: makeascene-config
            - secretRef:
                name: makeascene-secrets
          env:
            - name: FLASK_APP
              value: "run.py"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: makeascene-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: makeascene-db-app
                  key: password
            - name: SQLALCHEMY_DATABASE_URI   # muss nach DB_USER/DB_PASSWORD stehen
              value: "postgresql+psycopg2://$(DB_USER):$(DB_PASSWORD)@makeascene-db-rw:5432/makeascene"