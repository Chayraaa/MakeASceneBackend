apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: makeascene
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: Make A Scene
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: makeascene
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: false
  postgres.yml: |
    apiVersion: 1

    datasources:
      - name: PostgreSQL
        type: postgres
        uid: postgres
        url: db:5432
        user: postgres
        secureJsonData:
          password: ${POSTGRES_PASSWORD}
        jsonData:
          database: makeascene
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
        editable: false
---
