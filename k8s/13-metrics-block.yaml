apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-deny-nginx-config
  namespace: makeascene
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        return 403;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-deny
  namespace: makeascene
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-deny
  template:
    metadata:
      labels:
        app: metrics-deny
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: metrics-deny-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: metrics-deny
  namespace: makeascene
spec:
  selector:
    app: metrics-deny
  ports:
    - port: 80
      targetPort: 80